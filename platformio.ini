[platformio]
default_envs = s3_tdisplay_motor_test
extra_configs =
    platformio_private.ini

; WiFi/OTA credentials — set in platformio_private.ini ([rover_wifi] section).
[rover_wifi]
build_flags =

; =============================================================================
; LilyGO T-Display-S3 (ESP32-S3, 16MB flash, OPI PSRAM)
; LilyGO T-Display-S3 — separate platform/board from the Pro S3 and AI cam.
; =============================================================================
[env:s3_common]
; Official LilyGO board def: qio flash + OPI PSRAM + 16MB + correct variant.
; Do NOT use esp32-s3-devkitc-1 (8MB / no PSRAM defaults) — causes boot loops on T-Display-S3.
platform = espressif32@6.9.0
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DROVER_TDISPLAY_S3=1
  -DPWM_FREQ_HZ=30000
  -DDIR_L=1
  -DPWM_L=2
  -DDIR_R=3
  -DPWM_R=10
  -DMPU_SDA=43
  -DMPU_SCL=44
  -DSTATUS_LED_PIN=-1
  -DPIN_BAT_ADC=16
  -DPIN_BUTTON_ESTOP=0
  -DPIN_BUTTON_GO=14
  ; Bench 2026-07: both wheels spin backward with DIR=fwd — invert in software (no rewire).
  -DMOTOR_INVERT_L=1
  -DMOTOR_INVERT_R=1
  ; Gen-3 gearbox @ 30 kHz: both wheels reliably start at 55% duty.
  -DMIN_PWM_FLOOR_L=0.55f
  -DMIN_PWM_FLOOR_R=0.55f

[env:s3_tdisplay_motor_test]
extends = env:s3_common
build_src_filter = +<motor_test.cpp> +<drive.cpp> +<rover_board_power.cpp> +<ir_tx.cpp> -<microros_main.cpp> -<mpu.cpp> -<rover_display.cpp> -<battery.cpp> -<estop.cpp> -<rover_ota.cpp> -<s3_min_test.cpp>

[env:s3_tdisplay_motor_test_rover]
extends = env:s3_tdisplay_motor_test
build_flags =
  ${env:s3_tdisplay_motor_test.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=0

[env:s3_tft_flags]
; Matches starsalmon/SnakeT-DisplayS3 + LilyGO Setup206 (parallel ST7789).
; All -D flags — no -include (breaks micro-ROS cmake). Applied only to display builds.
build_flags =
  -DDISABLE_ALL_LIBRARY_WARNINGS=1
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER
  -DCGRAM_OFFSET
  -DTFT_RGB_ORDER=TFT_BGR
  -DTFT_INVERSION_ON
  -DTFT_PARALLEL_8_BIT
  -DTFT_WIDTH=170
  -DTFT_HEIGHT=320
  -DTFT_DC=7
  -DTFT_RST=5
  -DTFT_WR=8
  -DTFT_RD=9
  -DTFT_D0=39
  -DTFT_D1=40
  -DTFT_D2=41
  -DTFT_D3=42
  -DTFT_D4=45
  -DTFT_D5=46
  -DTFT_D6=47
  -DTFT_D7=48
  -DTFT_BL=38
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD
  -DLOAD_FONT2
  -DLOAD_FONT4
  -DLOAD_GFXFF
  -DSMOOTH_FONT

; Bare-minimum S3 boot check — flash this if motor_test still boot-loops.
[env:s3_min]
extends = env:s3_common
build_src_filter = +<s3_min_test.cpp> +<rover_board_power.cpp> -<*> -<motor_test.cpp> -<microros_main.cpp>

; Full chip erase before reflash when stuck in ROM boot loop (USB only, JST disconnected).
[env:s3_erase]
extends = env:s3_common
targets = erase

; =============================================================================
; Unexpected Maker Pro S3 — sensor board (L8 + side ToF + sonar + IR + PCA)
; Drive stays on T-Display (rover-esp.local). This board is rover-tof.local.
; =============================================================================
[env:um_pros3_common]
platform = espressif32@6.9.0
board = um_pros3
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DROVER_PROS3=1
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  pololu/VL53L1X@^1.3.1
  pololu/VL53L0X@^1.3.1
  https://github.com/stm32duino/VL53L8CX.git

; USB serial bring-up: dual I2C scan + L8/sides/PCA/sonar/IR. No motors, no micro-ROS yet.
[env:um_pros3_tof_bringup]
extends = env:um_pros3_common
extra_scripts =
  pre:extra_scripts/patch_vl53l8cx.py
build_src_filter =
  -<*>
  +<pros3_tof_main.cpp>
  +<ir_tx.cpp>
  +<ultrasonic.cpp>
build_flags =
  ${env:um_pros3_common.build_flags}
  ${rover_wifi.build_flags}
upload_protocol = esptool
; TinyUF2: 1200bps touch drops CDC instead of ROM download. Hold BOOT, tap RESET, then upload.
board_upload.use_1200bps_touch = false
board_upload.wait_for_upload_port = false

; WiFi micro-ROS ToF agent — publishes /rover/tof/* (+ sonar/IR/scan) as rover-tof.local.
; STL-19P LaserScan is ~4 KB. Custom-transport MTU is 1400, one WiFi datagram:
; WiFiUDP::write() calls endPacket() at 1460 bytes and would split a larger XRCE
; message. At MTU 512 the scan was nine fragments on a stream the sensor tick
; could fill, and /rover/scan never went live. 1400 bytes makes it three
; fragments. Client history is 8 (a power of two); the agent default depth is 16,
; so the agent can reassemble them. History 16 at this MTU used 74% of DRAM.
; The agent takes the MTU from the client's CREATE_SESSION. The publish timeout
; stays 50 ms so a scan confirm cannot stall the ToF loop for 1 s.
[env:um_pros3_tof_microros]
extends = env:um_pros3_common
extra_scripts =
  pre:extra_scripts/check_tof_wifi_baked.py
  pre:extra_scripts/micro_ros_sanitize.py
  pre:extra_scripts/patch_vl53l8cx.py
  pre:extra_scripts/patch_microros_wifi_netlock.py
build_src_filter =
  -<*>
  +<pros3_tof_microros_main.cpp>
  +<ir_tx.cpp>
  +<ultrasonic.cpp>
  +<rover_ota.cpp>
  +<stl19p.cpp>
  +<rover_lidar.cpp>
build_flags =
  ${env:um_pros3_common.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DENABLE_OTA=1
  -DROVER_PROS3_ANT_EXTERNAL=1
  -DL8_I2C_HZ=400000
  -DROVER_MICROROS_WIFI=1
  -DROVER_AGENT_IP=\"192.168.3.172\"
  -DROVER_AGENT_PORT=8888
  -DROVER_L8_SWAP_LR=1
  ; IR fleet beacon (id 0 = Rover), 38 kHz gated bursts - OFF (camera glow)
  -DIR_TX_MODULATE=1
  -DFLEET_IR_ID=0
  -DROVER_IR_BEACON_ON=0   ; OFF: Pro S3 GPIO21 IR TX glows purple in the AI cam and broke recognition (Cain 2026-11-10)
  ; Wi-Fi diag build (2026-10-14) — set to 0 / remove to revert
  -DROVER_WIFI_DIAG=1
  -DROVER_WIFI_TXPOWER=78
  -DROVER_WIFI_FIRST=1
  -DROVER_UROS_PING_MISS=6
  -DROVER_UROS_PING_MS=200
  ${rover_wifi.build_flags}
lib_deps =
  ${env:um_pros3_common.lib_deps}
  https://github.com/micro-ROS/micro_ros_platformio
board_microros_transport = wifi
board_microros_distro = jazzy
board_microros_user_meta = metas/colcon_pros3_tof.meta
upload_protocol = esptool
board_upload.use_1200bps_touch = false
board_upload.wait_for_upload_port = false

; OTA upload once first USB flash is on WiFi as rover-tof.local.
[env:um_pros3_tof_microros_ota]
extends = env:um_pros3_tof_microros
upload_protocol = espota
upload_port = rover-tof.local
upload_flags =
  --timeout=120

; Drive-only T-Display — motors/IMU/heading/ticks/speaker/ring. ToF moved to Pro S3.
[env:s3_tdisplay_microros_rover_drive]
extends = env:s3_common
build_src_filter =
  +<microros_main.cpp> +<drive.cpp> +<mpu.cpp> +<heading_hold.cpp> +<motion_detect.cpp>
  +<status_led.cpp> +<rover_board_power.cpp> +<rover_display.cpp> +<battery.cpp>
  +<estop.cpp> +<rover_go_button.cpp> +<rover_ota.cpp> +<rover_mcp_ir.cpp>
  +<ir_tx.cpp> +<fleet_ir_rx.cpp> +<rover_diag.cpp> +<rover_speaker.cpp>
  +<rover_ring.cpp> +<rover_periph.cpp> +<rover_boot_beep.cpp>
  +<rover_pca9685.cpp>
  -<motor_test.cpp> -<s3_min_test.cpp> -<rover_shift_ir.cpp>
  +<rover_batt_http.cpp> -<rover_vl53.cpp> -<rover_vl53l8.cpp> -<rover_sonar.cpp>
  -<ultrasonic.cpp> -<pros3_tof_main.cpp> -<pros3_tof_microros_main.cpp>
build_flags =
  ${env:s3_common.build_flags}
  ${env:s3_tft_flags.build_flags}
  -DROVER_MCP_IR=1
  -DFLEET_IR_ID=0
  -DROVER_PERIPH=1
  -DROVER_DRIVE_ONLY=1
  -DIR_TX_DEFAULT_ON=0
  -DHEADING_HOLD=1
  -DCMD_VEL_CROSS_FIX=0
  -DIMU_GYRO_YAW_SIGN=1.0f
  -DHEADING_ADJ_MAP_DEG=3.0f
  -DHEADING_ADJ_OUT_NORM=0.012f
  -DHEADING_TRIM_MAX=0.012f
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DENABLE_OTA=1
  -DROVER_MICROROS_WIFI=1
  -DROVER_AGENT_IP=\"192.168.3.172\"
  -DROVER_AGENT_PORT=8888
  ${rover_wifi.build_flags}
lib_deps =
  https://github.com/micro-ROS/micro_ros_platformio
  bodmer/TFT_eSPI@^2.5.43
  adafruit/Adafruit NeoPixel @ ^1.12.0
extra_scripts =
  pre:extra_scripts/micro_ros_sanitize.py
  pre:extra_scripts/patch_microros_wifi_netlock.py
board_microros_transport = wifi
board_microros_distro = jazzy
board_microros_user_meta = metas/colcon_rover.meta

[env:s3_tdisplay_microros_rover_drive_ota]
extends = env:s3_tdisplay_microros_rover_drive
upload_protocol = espota
upload_port = rover-esp.local
upload_flags =
  --timeout=120

; USB recovery when rover-esp is offline (WiFi down, etc.).
[env:s3_tdisplay_microros_rover_drive_usb]
extends = env:s3_tdisplay_microros_rover_drive
upload_protocol = esptool

; =============================================================================
; DFRobot ESP32-S3 AI Camera V1.1 (DFR1154) — Rover camera node (OV3660, 16 MB / 8 MB OPI PSRAM)
; MJPEG :81/stream, :80/capture /control /status /ir. First flash over USB, then OTA.
; =============================================================================
[env:aicam_rover_cam]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 921600
build_src_filter =
  -<*>
  +<aicam_main.cpp>
  +<aicam_audio.cpp>
  +<aicam_whistle.cpp>
  +<rover_ota.cpp>
board_build.filesystem = littlefs
; ESP32-audioI2S 2.0.x = last line for Arduino core 2.0.x (platform 6.9.0); 3.x needs core 3.
lib_deps =
  https://github.com/schreibfaul1/ESP32-audioI2S.git#2.0.6
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  -DENABLE_OTA=1
  -DROVER_CAM_HOSTNAME=\"rover-cam\"
  ${rover_wifi.build_flags}

[env:aicam_rover_cam_ota]
extends = env:aicam_rover_cam
upload_protocol = espota
upload_port = rover-cam.local
