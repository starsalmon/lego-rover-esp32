[platformio]
default_envs = s3_tdisplay_motor_test
extra_configs =
    platformio_private.ini

; WiFi/OTA credentials — set in platformio_private.ini ([rover_wifi] section).
[rover_wifi]
build_flags =

; =============================================================================
; ESP32-C3 Zero (legacy board)
; =============================================================================
[env:c3_base]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DPWM_FREQ_HZ=20000
  -DDIR_L=0
  -DPWM_L=1
  -DDIR_R=3
  -DPWM_R=2
  -DMPU_SDA=8
  -DMPU_SCL=9
  -DPI_UART_RX=20
  -DPI_UART_TX=21
  -DSTATUS_LED_PIN=10
  -DSTATUS_LED_BRIGHTNESS_PCT=10

[env:c3_motor_test]
extends = env:c3_base
build_src_filter = +<motor_test.cpp> +<drive.cpp> +<rover_board_power.cpp> -<microros_main.cpp> -<mpu.cpp> -<rover_display.cpp> -<battery.cpp> -<estop.cpp> -<rover_ota.cpp> -<s3_min_test.cpp>

[env:c3_microros]
extends = env:c3_base
build_src_filter = +<microros_main.cpp> +<drive.cpp> +<mpu.cpp> +<heading_hold.cpp> +<motion_detect.cpp> +<status_led.cpp> +<rover_board_power.cpp> -<motor_test.cpp> -<s3_min_test.cpp>
build_flags =
  ${env:c3_base.build_flags}
  -DMIN_PWM_FLOOR_L=0.58f
  -DMIN_PWM_FLOOR_R=0.57f
  -DHEADING_HOLD=1
  -DCMD_VEL_CROSS_FIX=0
  -DIMU_GYRO_YAW_SIGN=1.0f
  -DHEADING_ADJ_MAP_DEG=3.0f
  -DHEADING_ADJ_OUT_NORM=0.156f
  -DHEADING_TRIM_MAX=0.156f
lib_deps =
  https://github.com/micro-ROS/micro_ros_platformio
  adafruit/Adafruit NeoPixel @ ^1.12.0
board_microros_transport = serial
board_microros_distro = jazzy

; =============================================================================
; LilyGO T-Display-S3 (ESP32-S3, 16MB flash, OPI PSRAM)
; Does NOT inherit from c3_base — completely separate platform/board.
; =============================================================================
[env:s3_common]
; Official LilyGO board def: qio flash + OPI PSRAM + 16MB + correct variant.
; Do NOT use esp32-s3-devkitc-1 (8MB / no PSRAM defaults) — causes boot loops on T-Display-S3.
platform = espressif32@6.9.0
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DROVER_TDISPLAY_S3=1
  -DPWM_FREQ_HZ=20000
  -DDIR_L=1
  -DPWM_L=2
  -DDIR_R=3
  -DPWM_R=10
  -DMPU_SDA=43
  -DMPU_SCL=44
  -DPI_UART_PORT=1
  -DPI_UART_RX=17
  -DPI_UART_TX=18
  -DPI_UART_BAUD=460800
  -DSTATUS_LED_PIN=-1
  -DPIN_BAT_ADC=16
  -DPIN_BUTTON_ESTOP=0
  -DPIN_BUTTON_GO=14
  ; Bench 2026-07: both wheels spin backward with DIR=fwd — invert in software (no rewire).
  -DMOTOR_INVERT_L=1
  -DMOTOR_INVERT_R=1
  ; 20 kHz bench: fwd start ~58% L / ~57% R (asymmetric floors OK for auto).
  -DMIN_PWM_FLOOR_L=0.58f
  -DMIN_PWM_FLOOR_R=0.57f

[env:s3_tdisplay_motor_test]
extends = env:s3_common
build_src_filter = +<motor_test.cpp> +<drive.cpp> +<rover_board_power.cpp> +<ir_tx.cpp> -<microros_main.cpp> -<mpu.cpp> -<rover_display.cpp> -<battery.cpp> -<estop.cpp> -<rover_ota.cpp> -<s3_min_test.cpp>

[env:s3_tdisplay_motor_test_rover]
extends = env:s3_tdisplay_motor_test
build_flags =
  ${env:s3_tdisplay_motor_test.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=0

[env:s3_tft_flags]
; Matches starsalmon/SnakeT-DisplayS3 + LilyGO Setup206 (parallel ST7789).
; All -D flags — no -include (breaks micro-ROS cmake). Applied only to display builds.
build_flags =
  -DDISABLE_ALL_LIBRARY_WARNINGS=1
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER
  -DCGRAM_OFFSET
  -DTFT_RGB_ORDER=TFT_BGR
  -DTFT_INVERSION_ON
  -DTFT_PARALLEL_8_BIT
  -DTFT_WIDTH=170
  -DTFT_HEIGHT=320
  -DTFT_DC=7
  -DTFT_RST=5
  -DTFT_WR=8
  -DTFT_RD=9
  -DTFT_D0=39
  -DTFT_D1=40
  -DTFT_D2=41
  -DTFT_D3=42
  -DTFT_D4=45
  -DTFT_D5=46
  -DTFT_D6=47
  -DTFT_D7=48
  -DTFT_BL=38
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD
  -DLOAD_FONT2
  -DLOAD_FONT4
  -DLOAD_GFXFF
  -DSMOOTH_FONT

[env:s3_tdisplay_microros]
extends = env:s3_common
extra_scripts =
  pre:extra_scripts/micro_ros_sanitize.py
  pre:extra_scripts/patch_vl53l8cx.py
build_src_filter = +<microros_main.cpp> +<drive.cpp> +<mpu.cpp> +<heading_hold.cpp> +<motion_detect.cpp> +<status_led.cpp> +<rover_board_power.cpp> +<rover_display.cpp> +<battery.cpp> +<estop.cpp> +<rover_go_button.cpp> +<rover_ota.cpp> +<rover_mcp_ir.cpp> +<rover_pca9685.cpp> +<ir_tx.cpp> +<ultrasonic.cpp> +<rover_sonar.cpp> +<rover_diag.cpp> +<rover_vl53.cpp> +<rover_vl53l8.cpp> +<rover_speaker.cpp> +<rover_ring.cpp> +<rover_periph.cpp> -<motor_test.cpp> -<s3_min_test.cpp> -<rover_shift_ir.cpp>
build_flags =
  ${env:s3_common.build_flags}
  ${env:s3_tft_flags.build_flags}
  -DROVER_MCP_IR=1
  -DROVER_SONAR=1
  -DROVER_VL53L=1
  -DROVER_VL53L8=1
  -DROVER_PERIPH=1
  -DHEADING_HOLD=1
  -DCMD_VEL_CROSS_FIX=0
  ; MPU mounted reversed on current chassis — was -1.0f for old orientation.
  -DIMU_GYRO_YAW_SIGN=1.0f
  -DHEADING_ADJ_MAP_DEG=3.0f
  -DHEADING_ADJ_OUT_NORM=0.156f
  -DHEADING_TRIM_MAX=0.156f
lib_deps =
  https://github.com/micro-ROS/micro_ros_platformio
  bodmer/TFT_eSPI@^2.5.43
  pololu/VL53L1X@^1.3.1
  pololu/VL53L0X@^1.3.1
  https://github.com/stm32duino/VL53L8CX.git
  adafruit/Adafruit NeoPixel @ ^1.12.0
board_microros_transport = serial
board_microros_distro = jazzy
board_microros_user_meta = metas/colcon_rover.meta

[env:s3_tdisplay_microros_ota]
extends = env:s3_tdisplay_microros
build_flags =
  ${env:s3_tdisplay_microros.build_flags}
  -DENABLE_OTA=1
  ${rover_wifi.build_flags}
upload_protocol = espota
upload_port = rover-esp.local
upload_flags =
  --timeout=120

; Production rover — thin ESP client, WiFi micro-ROS straight to dockerhost agent.
; Brain: rover-brain container on dockerhost (see ../lego-rover-ros2/ROVER_BEHAVIOR.md). No Pi.
[env:s3_tdisplay_microros_rover]
extends = env:s3_tdisplay_microros
board_microros_transport = wifi
build_flags =
  ${env:s3_tdisplay_microros.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DENABLE_OTA=1
  -DROVER_MICROROS_WIFI=1
  -DROVER_AGENT_IP=\"192.168.2.31\"
  -DROVER_AGENT_PORT=8888
  ${rover_wifi.build_flags}

[env:s3_tdisplay_microros_rover_ota]
extends = env:s3_tdisplay_microros_rover
upload_protocol = espota
upload_port = rover-esp.local
upload_flags =
  --timeout=120

; Deprecated bench — ESP-local wander (do not flash for normal use).
[env:s3_standalone_bench]
extends = env:s3_common
build_src_filter = +<standalone_main.cpp> +<rover_wander.cpp> +<rover_pi_periph.cpp> +<rover_telem.cpp> +<drive.cpp> +<mpu.cpp> +<heading_hold.cpp> +<motion_detect.cpp> +<status_led.cpp> +<rover_board_power.cpp> +<rover_display.cpp> +<battery.cpp> +<estop.cpp> +<rover_go_button.cpp> +<rover_ota.cpp> +<rover_mcp_ir.cpp> +<rover_pca9685.cpp> +<ir_tx.cpp> +<ultrasonic.cpp> +<rover_sonar.cpp> -<motor_test.cpp> -<s3_min_test.cpp> -<microros_main.cpp> -<rover_shift_ir.cpp>
build_flags =
  ${env:s3_common.build_flags}
  ${env:s3_tft_flags.build_flags}
  -DROVER_MCP_IR=1
  -DROVER_SONAR=1
  -DHEADING_HOLD=1
  -DIMU_GYRO_YAW_SIGN=1.0f
  -DPI_PERIPH_BAUD=115200
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DENABLE_OTA=1
  ${rover_wifi.build_flags}
lib_deps =
  bodmer/TFT_eSPI@^2.5.43

; Bare-minimum S3 boot check — flash this if motor_test still boot-loops.
[env:s3_min]
extends = env:s3_common
build_src_filter = +<s3_min_test.cpp> +<rover_board_power.cpp> -<*> -<motor_test.cpp> -<microros_main.cpp>

; Full chip erase before reflash when stuck in ROM boot loop (USB only, JST disconnected).
[env:s3_erase]
extends = env:s3_common
targets = erase
